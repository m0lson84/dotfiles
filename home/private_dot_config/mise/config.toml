[settings]
env_file                            = ".env"
idiomatic_version_file_enable_tools = ["go", "node", "python"]
minimum_release_age                 = "0d"

[settings.python]
compile = false

[tools]
aws-cdk          = "2"
biome            = "latest"
bruno-cli        = "latest"
commitizen       = "latest"
devcontainer-cli = "latest"
ruff             = "latest"
uv               = "latest"

[tool_alias]
bruno-cli  = "npm:@usebruno/cli"
commitizen = "pypi:commitizen"

[tools.bun]
version = "1.4"

[tools.go]
version = "1.27"

[tools.node]
version = "lts"

[tools.python]
version = "3.15"

[tools.rust]
version    = "stable"
components = "rust-analyzer"

[tools.zig]
version = "0.17"
